# fly.toml app configuration file generated for tron-legacy-api-little-smoke-1826 on 2026-03-31T10:15:25-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tron-legacy-api-little-smoke-1826'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[env]
  CONTABIL_API_URL = 'https://whodo-contabil-api.fly.dev'
  ALLOWED_HOSTS = 'tron-legacy-api-little-smoke-1826.fly.dev'

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    port = 8080
    timeout = "10s"
    type = "http"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
